name: CI

on:
  push:
    branches: [ main, rework-epoll ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and test (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: g++
            packages: g++
          # Verify locally first, then enable:
          #   sudo apt install clang
          #   cmake -B build-clang -DCMAKE_CXX_COMPILER=clang++ && cmake --build build-clang -j
          # - compiler: clang++
          #   packages: clang
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ${{ matrix.packages }}

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Integration smoke test
        run: ./tests/smoke_test.sh ./build/multithreaded-server

  sanitizers:
    name: Sanitizers (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: address+undefined
            flags: "-fsanitize=address,undefined -fno-omit-frame-pointer -g"
          - name: thread
            flags: "-fsanitize=thread -g"
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="${{ matrix.flags }}"

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Unit tests
        env:
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          TSAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir build --output-on-failure

      - name: Integration smoke test
        env:
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          TSAN_OPTIONS: halt_on_error=1
        run: ./tests/smoke_test.sh ./build/multithreaded-server

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t epoll-http-server .

      # Mirrors how Render runs it: configuration only through environment
      # variables, with the host choosing the port.
      - name: Run container
        run: docker run -d --name server -e PORT=10000 -p 10000:10000 epoll-http-server

      - name: Probe running container
        run: |
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:10000/healthz && break
            sleep 1
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:10000/)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:10000/demo/index.html)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -d 'key=ci&value=ok' http://127.0.0.1:10000/api/kv)" = 201
          curl -fsS http://127.0.0.1:10000/api/stats

      - name: Graceful stop
        run: |
          docker stop --time 10 server
          test "$(docker inspect -f '{{.State.ExitCode}}' server)" = 0

      - name: Container logs
        if: always()
        run: docker logs server || true
